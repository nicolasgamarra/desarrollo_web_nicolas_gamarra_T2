<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estadísticas</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
</head>
<body>
  <h1>Estadísticas</h1>

  <h2>Actividades por Día</h2>
  <div id="grafico-lineas" style="width:80%; height:400px;"></div>

  <h2>Actividades por Tipo</h2>
  <div id="grafico-torta" style="width:80%; height:400px;"></div>

  <h2>Actividades por Mes y Franja Horaria</h2>
  <div id="grafico-barras" style="width:80%; height:400px;"></div>

  <br><br>
  <a href="{{ url_for('portada') }}">Volver a la portada</a>

  <script>
    // Grafico lienas a partir de la paginas que recomendaron
    fetch("/api/estadisticas/actividades_por_dia")
      .then(res => res.json())
      .then(data => {
        Highcharts.chart('grafico-lineas', {
          chart: { type: 'line' },
          title: { text: 'Actividades por Día' },
          xAxis: {
            categories: data.map(d => d.fecha),
            title: { text: 'Fecha' }
          },
          yAxis: {
            title: { text: 'Cantidad' },
            allowDecimals: false
          },
          series: [{
            name: 'Actividades',
            data: data.map(d => d.cantidad)
          }]
        });
      });

    // grafico de rotar a partir de las paginas que comentaron
    fetch("/api/estadisticas/actividades_por_tema")
      .then(res => res.json())
      .then(data => {
        Highcharts.chart('grafico-torta', {
          chart: { type: 'pie' },
          title: { text: 'Distribución por Tipo de Actividad' },
          series: [{
            name: 'Cantidad',
            colorByPoint: true,
            data: data.map(d => ({ name: d.tema, y: d.cantidad }))
          }]
        });
      });

    // grafico de barra a partir de las paginas que comentaron en el enunciado y comento el auxiliar.
    fetch("/api/estadisticas/actividades_por_horario_mes")
      .then(res => res.json())
      .then(data => {
        Highcharts.chart('grafico-barras', {
          chart: { type: 'column' },
          title: { text: 'Actividades por Mes y Franja Horaria' },
          xAxis: {
            categories: data.meses,
            title: { text: 'Mes' }
          },
          yAxis: {
            min: 0,
            title: { text: 'Cantidad de Actividades' },
            allowDecimals: false
          },
          series: data.series
        });
      });
  </script>
</body>
</html>
